name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Bani-Global-Industries-LLP/stampmitra-developer-openapi
          path: .openapi
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.0.x
            8.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Tag matches the package versions and StampMitraClient.Version
        run: |
          v="${GITHUB_REF_NAME#v}"
          for f in src/StampMitra/StampMitra.csproj src/StampMitra.Extensions.DependencyInjection/StampMitra.Extensions.DependencyInjection.csproj; do
            grep -q "<Version>${v}</Version>" "$f" || { echo "::error::$f is not version ${v}"; exit 1; }
          done
          grep -q "Version = \"${v}\"" src/StampMitra/StampMitraClient.cs || { echo "::error::StampMitraClient.Version is not ${v}"; exit 1; }
      - run: dotnet build StampMitra.sln --configuration Release
      - run: dotnet test StampMitra.sln --configuration Release --no-build
        env:
          STAMPMITRA_SPEC_DIR: ${{ github.workspace }}/.openapi
          CONFORMANCE_REQUIRED: '1'
      - run: scripts/check-spec-coverage.sh
      - run: dotnet format StampMitra.sln --verify-no-changes
      - run: dotnet pack src/StampMitra --configuration Release --no-build --output ./artifacts
      - run: dotnet pack src/StampMitra.Extensions.DependencyInjection --configuration Release --no-build --output ./artifacts
      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: artifacts/*
          if-no-files-found: error

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: artifacts
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" artifacts/* --generate-notes --title "${GITHUB_REF_NAME}" --verify-tag

  # Inert until the maintainer completes RELEASING.md and sets the repository variable NUGET_PUBLISH=true.
  publish:
    needs: build
    if: ${{ vars.NUGET_PUBLISH == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC token for NuGet trusted publishing; no long-lived API key is stored
      contents: read
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: artifacts
      - name: NuGet login (OIDC)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Push (the .snupkg symbol package is pushed along with each .nupkg)
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          for p in artifacts/*.nupkg; do
            dotnet nuget push "$p" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
          done
